<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440" xml:lang="de" role="img" aria-labelledby="title description">
<title id="title">Was bleibt von sechs Minuten?</title><desc id="description">Fiktives Beispiel: sechs Minuten gemeldete Ersparnis minus vier Minuten Nachprüfung ergeben zwei Minuten netto. Daraus folgen 480 Stunden und 24.000 Euro Kapazitätswert. Nach Lizenz bleiben 6.000 Euro pro Jahr, nach einmaliger Integration minus 6.000 Euro im ersten Jahr.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b8532e" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1440" fill="#faf8f2"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="72" y="58" font-size="28" fill="#6b6862" font-weight="400" >Kupermann Decision Partner</text><text x="72" y="146" font-size="62" fill="#141413" font-weight="400" font-family="Georgia, Cambria, serif">Was bleibt von sechs Minuten?</text><text x="72" y="202" font-size="29" fill="#6b6862" font-weight="400" >Illustratives Rechenbeispiel. Fiktive Daten, kein Wirksamkeitsnachweis.</text><line x1="72" y1="254" x2="1208" y2="254" stroke="#141413" stroke-width="2" /><text x="72" y="316" font-size="29" fill="#6b6862" font-weight="400" >Gemeldete Zeitersparnis</text><text x="448" y="316" font-size="29" fill="#6b6862" font-weight="400" >Nicht erfasste Nachprüfung</text><text x="886" y="316" font-size="29" fill="#6b6862" font-weight="400" >Nettoersparnis</text><text x="72" y="410" font-size="78" fill="#141413" font-weight="600" >6 min</text><text x="448" y="410" font-size="78" fill="#141413" font-weight="600" >4 min</text><text x="886" y="410" font-size="78" fill="#b8532e" font-weight="600" >2 min</text><text x="367" y="402" font-size="58" fill="#6b6862" font-weight="400" >−</text><text x="800" y="402" font-size="58" fill="#6b6862" font-weight="400" >=</text><line x1="72" y1="460" x2="1208" y2="460" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="526" font-size="31" fill="#141413" font-weight="600" >Jährliches Volumen im Beispiel</text><text x="72" y="582" font-size="32" fill="#141413" font-weight="400" >24.000 Tickets × 60 % Routineanteil = 14.400 Routinefälle</text><text x="72" y="635" font-size="32" fill="#141413" font-weight="400" >14.400 × 2 Minuten ÷ 60 = 480 Stunden Kapazität</text><text x="72" y="718" font-size="31" fill="#141413" font-weight="600" >Wert und Kosten pro Jahr</text><text x="72" y="780" font-size="31" fill="#141413" font-weight="400" >480 Stunden × 50 EUR pro Stunde</text><text x="1208" y="780" font-size="35" fill="#141413" font-weight="400" text-anchor="end">24.000 EUR</text><text x="72" y="856" font-size="31" fill="#141413" font-weight="400" >Abzüglich jährlicher Lizenz</text><text x="1208" y="856" font-size="35" fill="#141413" font-weight="400" text-anchor="end">− 18.000 EUR</text><line x1="72" y1="883" x2="1208" y2="883" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="932" font-size="31" fill="#141413" font-weight="400" >Saldo vor einmaligen Kosten</text><text x="1208" y="932" font-size="35" fill="#141413" font-weight="400" text-anchor="end">6.000 EUR</text><text x="72" y="1008" font-size="31" fill="#141413" font-weight="400" >Abzüglich einmaliger Integration</text><text x="1208" y="1008" font-size="35" fill="#141413" font-weight="400" text-anchor="end">− 12.000 EUR</text><line x1="72" y1="1035" x2="1208" y2="1035" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="1084" font-size="31" fill="#b8532e" font-weight="600" >Saldo im ersten Jahr</text><text x="1208" y="1084" font-size="35" fill="#b8532e" font-weight="600" text-anchor="end">− 6.000 EUR</text><rect x="72" y="1144" width="1136" height="248" fill="#f5f2e8"/><text x="98" y="1194" font-size="32" fill="#b8532e" font-weight="600" >Kapazitätswert ist keine zahlungswirksame Einsparung.</text><text x="98" y="1245" font-size="29" fill="#141413" font-weight="400" >Einfache Fälle und freiwillig Teilnehmende begrenzen die Aussage.</text><text x="98" y="1286" font-size="29" fill="#141413" font-weight="400" >Vor einem vollständigen Rollout gezielt prüfen:</text><text x="98" y="1327" font-size="29" fill="#141413" font-weight="400" >repräsentative Fälle, gesamte Nacharbeit und tatsächliche Nutzung.</text></g></svg>
