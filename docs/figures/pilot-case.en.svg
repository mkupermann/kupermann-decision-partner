<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440" xml:lang="en" role="img" aria-labelledby="title description">
<title id="title">What remains of six minutes?</title><desc id="description">Fictional example: six reported minutes less four review minutes yields two net minutes, 480 hours and EUR 24,000 capacity value. After licence EUR 6,000 per year remains; after one-off integration, minus EUR 6,000 in year one.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b8532e" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1440" fill="#faf8f2"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="72" y="58" font-size="28" fill="#6b6862" font-weight="400" >Kupermann Decision Partner</text><text x="72" y="146" font-size="62" fill="#141413" font-weight="400" font-family="Georgia, Cambria, serif">What remains of six minutes?</text><text x="72" y="202" font-size="29" fill="#6b6862" font-weight="400" >Illustrative example. Fictional figures, not evidence of effectiveness.</text><line x1="72" y1="254" x2="1208" y2="254" stroke="#141413" stroke-width="2" /><text x="72" y="316" font-size="29" fill="#6b6862" font-weight="400" >Reported time saving</text><text x="448" y="316" font-size="29" fill="#6b6862" font-weight="400" >Omitted review time</text><text x="886" y="316" font-size="29" fill="#6b6862" font-weight="400" >Net saving</text><text x="72" y="410" font-size="78" fill="#141413" font-weight="600" >6 min</text><text x="448" y="410" font-size="78" fill="#141413" font-weight="600" >4 min</text><text x="886" y="410" font-size="78" fill="#b8532e" font-weight="600" >2 min</text><text x="367" y="402" font-size="58" fill="#6b6862" font-weight="400" >−</text><text x="800" y="402" font-size="58" fill="#6b6862" font-weight="400" >=</text><line x1="72" y1="460" x2="1208" y2="460" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="526" font-size="31" fill="#141413" font-weight="600" >Annual volume in this example</text><text x="72" y="582" font-size="32" fill="#141413" font-weight="400" >24,000 tickets × 60% routine share = 14,400 routine cases</text><text x="72" y="635" font-size="32" fill="#141413" font-weight="400" >14,400 × 2 minutes ÷ 60 = 480 hours of capacity</text><text x="72" y="718" font-size="31" fill="#141413" font-weight="600" >Annual value and costs</text><text x="72" y="780" font-size="31" fill="#141413" font-weight="400" >480 hours × EUR 50 per hour</text><text x="1208" y="780" font-size="35" fill="#141413" font-weight="400" text-anchor="end">EUR 24,000</text><text x="72" y="856" font-size="31" fill="#141413" font-weight="400" >Less annual licence</text><text x="1208" y="856" font-size="35" fill="#141413" font-weight="400" text-anchor="end">− EUR 18,000</text><line x1="72" y1="883" x2="1208" y2="883" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="932" font-size="31" fill="#141413" font-weight="400" >Balance before one-off costs</text><text x="1208" y="932" font-size="35" fill="#141413" font-weight="400" text-anchor="end">EUR 6,000</text><text x="72" y="1008" font-size="31" fill="#141413" font-weight="400" >Less one-off integration</text><text x="1208" y="1008" font-size="35" fill="#141413" font-weight="400" text-anchor="end">− EUR 12,000</text><line x1="72" y1="1035" x2="1208" y2="1035" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="1084" font-size="31" fill="#b8532e" font-weight="600" >First-year balance</text><text x="1208" y="1084" font-size="35" fill="#b8532e" font-weight="600" text-anchor="end">− EUR 6,000</text><rect x="72" y="1144" width="1136" height="248" fill="#f5f2e8"/><text x="98" y="1194" font-size="32" fill="#b8532e" font-weight="600" >Capacity value is not cash savings.</text><text x="98" y="1245" font-size="29" fill="#141413" font-weight="400" >Selected simple tickets and volunteers limit the inference.</text><text x="98" y="1286" font-size="29" fill="#141413" font-weight="400" >Validate before a full rollout: representative cases,</text><text x="98" y="1327" font-size="29" fill="#141413" font-weight="400" >all review work and whether the released capacity is used.</text></g></svg>
