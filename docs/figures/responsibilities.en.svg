<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" xml:lang="en" role="img" aria-labelledby="title description">
<title id="title">Human judgment stays in charge</title><desc id="description">Human: goals, values, trade-offs, risks and decision. AI: options, research, calculations, challenge and brief. Evidence checks are shared.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b8532e" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1160" fill="#faf8f2"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="72" y="58" font-size="28" fill="#6b6862" font-weight="400" >Kupermann Decision Partner</text><text x="72" y="146" font-size="60" fill="#141413" font-weight="400" font-family="Georgia, Cambria, serif">Human judgment stays in charge</text><text x="72" y="202" font-size="30" fill="#6b6862" font-weight="400" >AI expands the analysis. It does not own the value judgments.</text><line x1="72" y1="258" x2="1208" y2="258" stroke="#141413" stroke-width="2" /><text x="72" y="327" font-size="36" fill="#b8532e" font-weight="600" >The human owns</text><text x="688" y="327" font-size="36" fill="#141413" font-weight="600" >AI supports</text><line x1="634" y1="294" x2="634" y2="774" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="406" font-size="35" fill="#141413" font-weight="400" >Goals and framing</text><text x="72" y="485" font-size="35" fill="#141413" font-weight="400" >Values and priorities</text><text x="72" y="564" font-size="35" fill="#141413" font-weight="400" >Trade-offs</text><text x="72" y="643" font-size="35" fill="#141413" font-weight="400" >Risk acceptance</text><text x="72" y="722" font-size="35" fill="#141413" font-weight="600" >The decision</text><text x="688" y="406" font-size="34" fill="#141413" font-weight="400" >Developing options</text><text x="688" y="485" font-size="34" fill="#141413" font-weight="400" >Researching sources</text><text x="688" y="564" font-size="34" fill="#141413" font-weight="400" >Checking calculations</text><text x="688" y="643" font-size="34" fill="#141413" font-weight="400" >Challenging assumptions</text><text x="688" y="722" font-size="34" fill="#141413" font-weight="400" >Preparing the decision brief</text><rect x="72" y="812" width="1136" height="217" fill="#f5f2e8"/><text x="98" y="865" font-size="33" fill="#b8532e" font-weight="600" >Checked together</text><text x="98" y="917" font-size="31" fill="#141413" font-weight="400" >Make sources, assumptions and limitations visible.</text><text x="98" y="962" font-size="31" fill="#141413" font-weight="400" >Check whether the evidence is enough for this decision.</text><text x="72" y="1095" font-size="29" fill="#6b6862" font-weight="400" >A proposed preference is not an agreed preference.</text></g></svg>
