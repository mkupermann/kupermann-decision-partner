<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" xml:lang="de" role="img" aria-labelledby="title description">
<title id="title">Verantwortung bleibt beim Menschen</title><desc id="description">Mensch: Ziele, Werte, Abwägungen, Risiken und Entscheidung. KI: Optionen, Recherche, Berechnungen, Gegenprüfung und Vorlage. Evidenzprüfung gemeinsam.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b8532e" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1160" fill="#faf8f2"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="72" y="58" font-size="28" fill="#6b6862" font-weight="400" >Kupermann Decision Partner</text><text x="72" y="146" font-size="55" fill="#141413" font-weight="400" font-family="Georgia, Cambria, serif">Verantwortung bleibt beim Menschen</text><text x="72" y="202" font-size="30" fill="#6b6862" font-weight="400" >Die KI erweitert die Prüfung. Sie übernimmt keine Werturteile.</text><line x1="72" y1="258" x2="1208" y2="258" stroke="#141413" stroke-width="2" /><text x="72" y="327" font-size="36" fill="#b8532e" font-weight="600" >Der Mensch verantwortet</text><text x="688" y="327" font-size="36" fill="#141413" font-weight="600" >Die KI unterstützt</text><line x1="634" y1="294" x2="634" y2="774" stroke="#d8d1c4" stroke-width="2" /><text x="72" y="406" font-size="31" fill="#141413" font-weight="400" >Ziele und Problemrahmen</text><text x="72" y="485" font-size="31" fill="#141413" font-weight="400" >Werte und Prioritäten</text><text x="72" y="564" font-size="31" fill="#141413" font-weight="400" >Abwägungen und Zielkonflikte</text><text x="72" y="643" font-size="31" fill="#141413" font-weight="400" >Akzeptanz von Risiken</text><text x="72" y="722" font-size="31" fill="#141413" font-weight="600" >Die Entscheidung</text><text x="688" y="406" font-size="30" fill="#141413" font-weight="400" >Optionen entwickeln</text><text x="688" y="485" font-size="30" fill="#141413" font-weight="400" >Quellen recherchieren</text><text x="688" y="564" font-size="30" fill="#141413" font-weight="400" >Berechnungen prüfen</text><text x="688" y="643" font-size="30" fill="#141413" font-weight="400" >Annahmen hinterfragen</text><text x="688" y="722" font-size="30" fill="#141413" font-weight="400" >Entscheidungsvorlage erstellen</text><rect x="72" y="812" width="1136" height="217" fill="#f5f2e8"/><text x="98" y="865" font-size="33" fill="#b8532e" font-weight="600" >Gemeinsam prüfen</text><text x="98" y="917" font-size="31" fill="#141413" font-weight="400" >Quellen, Annahmen und Grenzen sichtbar machen.</text><text x="98" y="962" font-size="31" fill="#141413" font-weight="400" >Prüfen, ob die Evidenz für diese Entscheidung ausreicht.</text><text x="72" y="1095" font-size="29" fill="#6b6862" font-weight="400" >Vorgeschlagene Präferenzen sind noch keine bestätigten Präferenzen.</text></g></svg>
