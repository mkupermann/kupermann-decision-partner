<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320" xml:lang="en" role="img" aria-labelledby="title description">
<title id="title">From question to decision</title><desc id="description">Six steps, with a return loop when assumptions fail. The human retains the decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b8532e" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1320" fill="#faf8f2"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="72" y="58" font-size="28" fill="#6b6862" font-weight="400" >Kupermann Decision Partner</text><text x="72" y="146" font-size="64" fill="#141413" font-weight="400" font-family="Georgia, Cambria, serif">From question to decision</text><text x="72" y="202" font-size="30" fill="#6b6862" font-weight="400" >Go deeper when it can improve the decision.</text><line x1="112" y1="323" x2="112" y2="1020" stroke="#d8d1c4" stroke-width="3" /><path d="M 86 896 C 34 896 34 872 34 838 L 34 343 C 34 307 39 300 78 300" fill="none" stroke="#b8532e" stroke-width="3" marker-end="url(#arrow)"/><circle cx="112" cy="300" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="310" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">1</text><text x="174" y="310" font-size="41" fill="#141413" font-weight="600" >Frame the decision</text><text x="174" y="357" font-size="29" fill="#6b6862" font-weight="400" >What needs deciding?</text><text x="174" y="396" font-size="29" fill="#6b6862" font-weight="400" >Who is affected, and what can change?</text><circle cx="112" cy="449" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="459" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">2</text><text x="174" y="459" font-size="41" fill="#141413" font-weight="600" >Set the criteria</text><text x="174" y="506" font-size="29" fill="#6b6862" font-weight="400" >What matters? Which trade-offs and risks</text><text x="174" y="545" font-size="29" fill="#6b6862" font-weight="400" >does the human accept?</text><circle cx="112" cy="598" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="608" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">3</text><text x="174" y="608" font-size="41" fill="#141413" font-weight="600" >Develop options</text><text x="174" y="655" font-size="29" fill="#6b6862" font-weight="400" >Compare credible alternatives,</text><text x="174" y="694" font-size="29" fill="#6b6862" font-weight="400" >including the status quo and the simplest solution.</text><circle cx="112" cy="747" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="757" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">4</text><text x="174" y="757" font-size="41" fill="#141413" font-weight="600" >Investigate selectively</text><text x="174" y="804" font-size="29" fill="#6b6862" font-weight="400" >Which unknown could change the decision?</text><text x="174" y="843" font-size="29" fill="#6b6862" font-weight="400" >Choose the evidence, calculation or test that resolves it.</text><circle cx="112" cy="896" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="906" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">5</text><text x="174" y="906" font-size="41" fill="#141413" font-weight="600" >Challenge the recommendation</text><text x="174" y="953" font-size="29" fill="#6b6862" font-weight="400" >Check counterevidence, downsides and sensitivity.</text><text x="174" y="992" font-size="29" fill="#6b6862" font-weight="400" >Does the recommendation survive different assumptions?</text><circle cx="112" cy="1045" r="28" fill="#faf8f2" stroke="#b8532e" stroke-width="2"/><text x="112" y="1055" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">6</text><text x="174" y="1055" font-size="41" fill="#141413" font-weight="600" >Recommend and revisit</text><text x="174" y="1102" font-size="29" fill="#6b6862" font-weight="400" >The human decides. Record the next step</text><text x="174" y="1141" font-size="29" fill="#6b6862" font-weight="400" >and a concrete trigger for reconsideration.</text><rect x="72" y="1173" width="1136" height="102" fill="#f5f2e8"/><text x="96" y="1216" font-size="30" fill="#b8532e" font-weight="600" >If an assumption fails:</text><text x="96" y="1256" font-size="29" fill="#141413" font-weight="400" >Return to the relevant frame, criteria or investigation.</text></g></svg>
