<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320" xml:lang="de" role="img" aria-labelledby="title description">
<title id="title">Von der Frage zur Entscheidung</title><desc id="description">Sechs Schritte mit Rücksprung bei widerlegten Annahmen. Der Mensch behält die Entscheidung.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b8532e" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1320" fill="#faf8f2"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="72" y="58" font-size="28" fill="#6b6862" font-weight="400" >Kupermann Decision Partner</text><text x="72" y="146" font-size="57" fill="#141413" font-weight="400" font-family="Georgia, Cambria, serif">Von der Frage zur Entscheidung</text><text x="72" y="202" font-size="30" fill="#6b6862" font-weight="400" >Tiefe nach Bedarf. Zusätzliche Arbeit muss die Entscheidung verbessern.</text><line x1="112" y1="323" x2="112" y2="1020" stroke="#d8d1c4" stroke-width="3" /><path d="M 86 896 C 34 896 34 872 34 838 L 34 343 C 34 307 39 300 78 300" fill="none" stroke="#b8532e" stroke-width="3" marker-end="url(#arrow)"/><circle cx="112" cy="300" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="310" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">1</text><text x="174" y="310" font-size="41" fill="#141413" font-weight="600" >Problem klären</text><text x="174" y="357" font-size="29" fill="#6b6862" font-weight="400" >Welche Entscheidung steht an?</text><text x="174" y="396" font-size="29" fill="#6b6862" font-weight="400" >Wer ist betroffen, was ist veränderbar?</text><circle cx="112" cy="449" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="459" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">2</text><text x="174" y="459" font-size="41" fill="#141413" font-weight="600" >Kriterien festlegen</text><text x="174" y="506" font-size="29" fill="#6b6862" font-weight="400" >Was zählt? Welche Zielkonflikte und Risiken</text><text x="174" y="545" font-size="29" fill="#6b6862" font-weight="400" >akzeptiert der Mensch?</text><circle cx="112" cy="598" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="608" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">3</text><text x="174" y="608" font-size="41" fill="#141413" font-weight="600" >Optionen entwickeln</text><text x="174" y="655" font-size="29" fill="#6b6862" font-weight="400" >Tragfähige Alternativen vergleichen,</text><text x="174" y="694" font-size="29" fill="#6b6862" font-weight="400" >einschließlich Status quo und einfachster Lösung.</text><circle cx="112" cy="747" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="757" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">4</text><text x="174" y="757" font-size="41" fill="#141413" font-weight="600" >Gezielt untersuchen</text><text x="174" y="804" font-size="29" fill="#6b6862" font-weight="400" >Welche offene Annahme könnte die Entscheidung ändern?</text><text x="174" y="843" font-size="29" fill="#6b6862" font-weight="400" >Dafür passende Quellen, Berechnungen oder Tests wählen.</text><circle cx="112" cy="896" r="28" fill="#faf8f2" stroke="#d8d1c4" stroke-width="2"/><text x="112" y="906" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">5</text><text x="174" y="906" font-size="41" fill="#141413" font-weight="600" >Empfehlung hinterfragen</text><text x="174" y="953" font-size="29" fill="#6b6862" font-weight="400" >Gegenbelege, Nachteile und Sensitivität prüfen.</text><text x="174" y="992" font-size="29" fill="#6b6862" font-weight="400" >Bleibt die Empfehlung bei anderen Annahmen tragfähig?</text><circle cx="112" cy="1045" r="28" fill="#faf8f2" stroke="#b8532e" stroke-width="2"/><text x="112" y="1055" font-size="28" fill="#b8532e" font-weight="600" text-anchor="middle">6</text><text x="174" y="1055" font-size="41" fill="#141413" font-weight="600" >Empfehlen und überprüfen</text><text x="174" y="1102" font-size="29" fill="#6b6862" font-weight="400" >Der Mensch entscheidet. Nächsten Schritt und</text><text x="174" y="1141" font-size="29" fill="#6b6862" font-weight="400" >einen konkreten Anlass zur Neubewertung festhalten.</text><rect x="72" y="1173" width="1136" height="102" fill="#f5f2e8"/><text x="96" y="1216" font-size="30" fill="#b8532e" font-weight="600" >Wenn eine Annahme nicht hält:</text><text x="96" y="1256" font-size="29" fill="#141413" font-weight="400" >Problem, Kriterien oder Untersuchung gezielt wieder aufnehmen.</text></g></svg>
